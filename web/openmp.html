.machine{grid-area:machine}
.svgwrap{overflow-x:auto}
#svg{display:block;width:100%;min-width:620px;height:auto}

#svg .fillA{fill:var(--acc-soft)}

#svg .hw.off{stroke:var(--line)!important;stroke-dasharray:3 3;fill:none}

.gridc{grid-area:grid;display:flex;flex-wrap:wrap;gap:16px}
.gridc > .card-h{flex-basis:100%;margin-bottom:0}
.cvbox{flex:1 1 300px;max-width:420px;min-width:0}

.legend{font-size:13px;color:var(--muted);margin:8px 0 0}
.side{flex:1 1 260px;min-width:0;display:flex;flex-direction:column;gap:14px}

.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;margin:0;font-size:13px}

#gantt{width:100%;display:block;height:170px}
#cache{width:100%;display:block;height:120px}
.stat{font-size:13px;margin:6px 0 0;font-variant-numeric:tabular-nums}
.stat b{font-family:var(--mono)}
.code{grid-area:code}
#code{margin:0;font-family:var(--mono);font-size:12.5px;line-height:1.6;background:var(--codebg);border-radius:8px;padding:8px 0;overflow-x:auto}

#code .ln.hl{background:var(--hl);border-left-color:var(--acc)}

.tk-c{color:var(--muted);font-style:italic}
.tk-k{color:var(--acc);font-weight:500}
.tk-f{color:var(--mem)}
.tk-n{color:var(--t2)}
.tk-p{color:var(--t4);font-weight:600}
.math{grid-area:math;--mk:var(--acc);--mk2:var(--mem)}
.mathgrid{display:grid;gap:16px 26px;grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.mathgrid > div{min-width:0}
.mstep{font-family:var(--display);font-weight:600;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:0 0 4px}
.m{font-family:"STIX Two Text","Cambria Math","Times New Roman",serif;font-size:18px;line-height:2.2;overflow-x:auto;white-space:nowrap;padding-bottom:2px}
.frac{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;margin:0 3px;line-height:1.3}
.frac>span:last-child{border-top:1px solid currentColor;padding-top:1px}
.mnote{font-size:13.5px;color:var(--muted);margin:6px 0 0;max-width:62ch}
.mnote b{color:var(--ink)}
.mfull{grid-column:1/-1;border-top:1px dashed var(--line);padding-top:10px;max-width:none}
.dif{color:var(--mk)} .rea{color:var(--mk2)}

</style>

</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand"><h1>OpenMP <span>Machine</span></h1><p data-i="subtitle"></p></div>
    <div class="hdr-right">
      <span class="pill" data-i="pill"></span>
      <button id="glossBtn" class="ghost" data-i="glossary"></button>
      <button id="langBtn" class="ghost" aria-label="Language">ES</button>
    </div>
  </header>

  <section class="controls" aria-label="Controls">
    <div class="transport">
      <button id="prev" class="tbtn" aria-label="Previous step">&#9664;</button>
      <button id="play" class="tbtn primary"></button>
      <button id="next" class="tbtn" aria-label="Next step">&#9654;</button>
      <span id="counter" class="counter"></span>
    </div>
    <div class="group"><span class="ctl-label" data-i="speed"></span>
      <div class="seg" id="speeds"><button data-v="0.5">0.5×</button><button data-v="1" aria-pressed="true">1×</button><button data-v="2">2×</button><button data-v="4">4×</button></div>
    </div>
    <div class="group"><span class="ctl-label" data-i="threads"></span>
      <div class="seg" id="threads"><button data-v="1">1</button><button data-v="2">2</button><button data-v="4">4</button><button data-v="8" aria-pressed="true">8</button></div>
    </div>
    <div class="group"><span class="ctl-label">schedule</span>
      <div class="seg" id="sched"><button data-v="static" aria-pressed="true">static</button><button data-v="dynamic">dynamic,16</button></div>
    </div>
  </section>

  <nav class="rail" id="rail" aria-label="Steps"></nav>
  <section id="gloss" class="card gloss" hidden></section>

  <main class="layout">
    <article class="card explain" aria-live="polite">
      <div class="eyebrow" id="eyebrow"></div>
      <h2 id="stepTitle"></h2>
      <div id="stepBody"></div>
      <div class="mini">
        <div class="mini-h"><span id="miniTitle"></span><span class="mini-btns"><button id="miniToggle" class="mbtn"></button><button id="miniPause" class="mbtn" aria-label="Pause"></button></span></div>
        <div class="mini-body">
          <canvas id="miniGrid" style="width:170px;height:134px" aria-label="4 by 5 iteration grid"></canvas>
          <div class="mini-side"><pre id="miniCode" class="mini-code"></pre><div id="miniLog" class="mini-log"></div></div>
        </div>
        <canvas id="miniStrip" aria-label="Iterations as one list, split among threads"></canvas>
        <p class="mini-note" id="miniNote"></p>
      </div>
      <div class="progress"><span id="bar"></span></div>
    </article>
    <section class="card machine">
      <div class="card-h"><span data-i="machine"></span><span class="muted" id="machineNote"></span></div>
      <div class="svgwrap"><svg id="svg" viewBox="0 0 760 316" role="img" aria-label="CPU with 4 cores, caches and shared RAM"></svg></div>
    </section>
    <section class="card gridc">
      <div class="card-h"><span data-i="domain"></span><span class="muted" id="gridStat"></span></div>
      <div class="cvbox">
        <canvas id="cv" aria-label="32 by 32 grid; click a cell to inspect it"></canvas>
        <p class="legend" id="legend"></p>
      </div>
      <div class="side">
        <div><p class="sub-h" data-i="inspector"></p><dl class="kv" id="insp"></dl></div>
        <div><p class="sub-h" data-i="timeline"></p><canvas id="gantt" aria-label="Thread timeline"></canvas><p class="stat" id="gStat"></p></div>
        <div><p class="sub-h" data-i="cachev"></p><canvas id="cache" aria-label="Cache lines for the selected iteration"></canvas><p class="legend" data-i="cachecap"></p></div>
      </div>
    </section>
    <section class="card code">
      <div class="card-h"><span>src/brusselator.cpp · main.cpp</span><span class="muted" data-i="condensed"></span></div>
      <pre id="code"></pre>
    </section>

    <section class="card math" id="math">
      <div class="card-h"><span>Forward Euler</span><span class="muted" id="mathSub"></span></div>
      <div class="mathgrid" id="mathBody"></div>
    </section>
  </main>
  <footer id="footer"></footer>
</div>

const STEPS={
en:[
 ["One chip, one memory",`<p>An OpenMP program is a normal C++ program. It runs on the <b>CPU</b>, and every thread reads and writes the <b>same RAM</b>. There is nothing to copy, unlike with a GPU.</p><p>Our toy CPU has 4 <b>cores</b>. Each core can hold 2 <b>hardware threads</b> at once (Hyper-Threading / SMT), so 8 threads can run at the same time. Press <b>Play</b> or use ← →. Click any cell to follow it.</p>`,`Your config.h asks for <b>num_threads = 16</b>, which fits a CPU with 8 cores × 2 threads.`],
 ["The data: a vector of vectors",`<p>The constructor creates <code>u</code>, <code>v</code>, <code>aux_u</code> and <code>aux_v</code> as <code>vector&lt;vector&lt;double&gt;&gt;</code>. Each row is a <b>separate heap allocation</b>, so rows are not necessarily next to each other in RAM. Inside a row, the 32 doubles are contiguous.</p><p>Notice the order: <code>aux_u = u</code> runs while <code>u</code> is still all zeros. We come back to this in step 12.</p>`],
 ["The serial part: only the master thread",`<p>Before any <code>#pragma</code>, the program has one thread, the <b>master</b> (thread 0). It runs <code>readMatrix</code> and fills <code>u</code> and <code>v</code> from the files.</p><p>The other cores sit idle. Everything outside a parallel region is serial, and by Amdahl's law that part limits the total speedup.</p>`],
 ["Fork: a team of threads",`<p><code>#pragma omp parallel for</code> opens a <b>parallel region</b>. The master <b>forks</b> a team of <code>num_threads</code> threads. The OpenMP runtime creates them the first time and keeps them asleep in a pool, so later steps only need to wake them up.</p><p>All threads share <code>u</code>, <code>v</code>, <code>aux_u</code> and <code>aux_v</code>. Variables declared inside the loop, like <code>lap_u</code>, are <b>private</b>: each thread has its own copy on its own stack.</p>`],
 ["Threads on cores",`<p>The <b>operating system</b> decides which core runs each thread. With 4 threads or fewer, each one gets a whole core. With 8, two threads share each core: they take turns using the same arithmetic units, so each one runs slower (here about 1.65× slower per thread).</p><p>Change <b>Threads</b> in the top bar and watch the cores.</p>`],
 ["collapse(2): one long list of iterations",`<p><code>collapse(2)</code> merges the <code>i</code> and <code>j</code> loops into one loop of 30 × 30 = 900 iterations. Iteration <code>k</code> maps back to a node like this:</p>`],
 ["Splitting the work: schedule",`<p>The iterations are divided among the threads. With <code>schedule(static)</code> (the default), each thread gets one contiguous <b>chunk</b> of about 900 / {T} = {chunk} iterations, decided before the loop starts. It costs nothing to organise, but it cannot adapt if one thread is slower.</p><p>With <code>schedule(dynamic,16)</code>, threads take chunks of 16 from a shared counter as they finish. Balance is better, but each grab has a small cost. Switch between them in the top bar.</p>`],
 ["One iteration and the caches",`<p>Each iteration reads <code>u[i][j]</code> and its 4 neighbours. RAM is slow, so the core uses <b>caches</b>: L1 (tiny, fastest), L2, and an L3 shared by all cores. Memory always moves in <b>cache lines</b> of 64 bytes = 8 doubles.</p><p>Reading <code>u[i][j]</code> brings in <code>u[i][j+1..]</code> too, so the next iterations find their data in L1. The hardware <b>prefetcher</b> sees the thread walking along rows i-1, i and i+1 and loads the next lines early.</p>`],
 ["SIMD inside one core",`<p>Inside each core there is a second layer of parallelism. With <code>-O3</code> the compiler can use <b>SIMD</b> instructions (AVX2) that do the same arithmetic on 4 doubles at once. This is the CPU's version of a GPU warp, only 4 wide instead of 32.</p><p><code>collapse(2)</code> turns i and j into a single counter, which can make it harder for the compiler to vectorise the inner loop. Measuring with and without it is a good experiment.</p>`],
 ["The loop runs",`<p>Now every thread walks through its chunk. Cells light up as <code>aux_u</code> is written. The timeline shows each thread's work: the bars are not equal, because threads that share a core run slower and some chunks are slower than others.</p><p>All 8 threads also share one memory bus. In the real 1024 × 1024 run, this loop is usually limited by memory bandwidth, not by arithmetic.</p>`],
 ["The implicit barrier",`<p>A <code>parallel for</code> ends with an <b>implicit barrier</b>: no thread can continue until <b>all</b> have finished. Threads that finished early sit idle (hatched in the timeline).</p><p>This is why <code>u.swap(aux_u)</code> is safe: when it runs, every iteration has finished writing <code>aux_u</code>. Without the barrier, a thread could read new values while others still write them (a <b>race condition</b>).</p>`],
 ["Swap and repeat",`<p><code>u.swap(aux_u)</code> swaps the internal pointers of the two vectors. No data is copied, like the pointer swap in CUDA. Then <code>main</code> calls the function again: <b>fork, loop, barrier, join</b>, 400,000 times.</p><p>Waking up the team and the barrier cost a few microseconds per step. For very small grids that overhead can be bigger than the work.</p>`,`<b>Bug in this project:</b> <code>aux_u</code> and <code>aux_v</code> were copied while still zero (step 2), and the loop never writes the border. After each swap the border switches between U0 and 0, so the Dirichlet condition only holds every other step. The fix: copy u into aux_u after <code>readMatrix</code>.`],
 ["OpenMP and CUDA side by side",`<p>Both versions run the same stencil. They differ in how many threads there are, where the data lives and who synchronises.</p>`]
],
es:[
 ["Un chip, una memoria",`<p>Un programa OpenMP es un programa C++ normal. Corre en la <b>CPU</b> y todos los hilos leen y escriben la <b>misma RAM</b>. No hay nada que copiar, a diferencia de la GPU.</p><p>Nuestra CPU de juguete tiene 4 <b>núcleos</b>. Cada núcleo puede alojar 2 <b>hilos hardware</b> a la vez (Hyper-Threading / SMT), así que pueden correr 8 hilos a la vez. Pulsa <b>Ejecutar</b> o usa ← →. Haz clic en una celda para seguirla.</p>`,`Tu config.h pide <b>num_threads = 16</b>, que encaja con una CPU de 8 núcleos × 2 hilos.`],
 ["Los datos: un vector de vectores",`<p>El constructor crea <code>u</code>, <code>v</code>, <code>aux_u</code> y <code>aux_v</code> como <code>vector&lt;vector&lt;double&gt;&gt;</code>. Cada fila es una <b>reserva de memoria aparte</b>, así que las filas no tienen por qué estar juntas en la RAM. Dentro de una fila, los 32 doubles sí son contiguos.</p><p>Fíjate en el orden: <code>aux_u = u</code> se ejecuta cuando <code>u</code> todavía vale cero. Volvemos a esto en el paso 12.</p>`],
 ["La parte secuencial: solo el hilo maestro",`<p>Antes de cualquier <code>#pragma</code>, el programa tiene un solo hilo, el <b>maestro</b> (hilo 0). Ejecuta <code>readMatrix</code> y llena <code>u</code> y <code>v</code> desde los archivos.</p><p>Los demás núcleos esperan sin hacer nada. Todo lo que está fuera de una región paralela es secuencial y, por la ley de Amdahl, limita la aceleración total.</p>`],
 ["Fork: un equipo de hilos",`<p><code>#pragma omp parallel for</code> abre una <b>región paralela</b>. El maestro hace <b>fork</b> de un equipo de <code>num_threads</code> hilos. El runtime de OpenMP los crea la primera vez y los deja dormidos en un pool, así los pasos siguientes solo tienen que despertarlos.</p><p>Todos los hilos comparten <code>u</code>, <code>v</code>, <code>aux_u</code> y <code>aux_v</code>. Las variables declaradas dentro del bucle, como <code>lap_u</code>, son <b>privadas</b>: cada hilo tiene su copia en su propia pila.</p>`],
 ["Hilos en núcleos",`<p>El <b>sistema operativo</b> decide qué núcleo ejecuta cada hilo. Con 4 hilos o menos, cada uno tiene un núcleo entero. Con 8, dos hilos comparten cada núcleo: se turnan las mismas unidades aritméticas, así que cada uno va más lento (aquí unas 1,65 veces más lento por hilo).</p><p>Cambia <b>Hilos</b> en la barra superior y mira los núcleos.</p>`],
 ["collapse(2): una lista larga de iteraciones",`<p><code>collapse(2)</code> une los bucles <code>i</code> y <code>j</code> en un solo bucle de 30 × 30 = 900 iteraciones. La iteración <code>k</code> vuelve a un nodo así:</p>`],
 ["Repartir el trabajo: schedule",`<p>Las iteraciones se reparten entre los hilos. Con <code>schedule(static)</code> (el valor por defecto), cada hilo recibe un <b>bloque</b> contiguo de unas 900 / {T} = {chunk} iteraciones, decidido antes de empezar. No cuesta nada organizarlo, pero no se adapta si un hilo va más lento.</p><p>Con <code>schedule(dynamic,16)</code>, los hilos toman bloques de 16 de un contador compartido a medida que terminan. El reparto es más equilibrado, pero cada toma tiene un pequeño coste. Cámbialo en la barra superior.</p>`],
 ["Una iteración y las cachés",`<p>Cada iteración lee <code>u[i][j]</code> y sus 4 vecinos. La RAM es lenta, así que el núcleo usa <b>cachés</b>: L1 (diminuta y rapidísima), L2 y una L3 compartida por todos los núcleos. La memoria siempre se mueve en <b>líneas de caché</b> de 64 bytes = 8 doubles.</p><p>Leer <code>u[i][j]</code> trae también <code>u[i][j+1..]</code>, así que las siguientes iteraciones encuentran sus datos en L1. El <b>prefetcher</b> ve que el hilo recorre las filas i-1, i e i+1 y carga las siguientes líneas por adelantado.</p>`],
 ["SIMD dentro de un núcleo",`<p>Dentro de cada núcleo hay una segunda capa de paralelismo. Con <code>-O3</code> el compilador puede usar instrucciones <b>SIMD</b> (AVX2), que hacen la misma operación sobre 4 doubles a la vez. Es la versión CPU de un warp de GPU, solo que de 4 en lugar de 32.</p><p><code>collapse(2)</code> convierte i y j en un único contador, lo que puede dificultar que el compilador vectorice el bucle interior. Medir con y sin él es un buen experimento.</p>`],
 ["El bucle se ejecuta",`<p>Ahora cada hilo recorre su bloque. Las celdas se iluminan a medida que se escribe <code>aux_u</code>. La línea de tiempo muestra el trabajo de cada hilo: las barras no son iguales, porque los hilos que comparten núcleo van más lentos y unos bloques tardan más que otros.</p><p>Los 8 hilos comparten además un solo bus de memoria. En la ejecución real de 1024 × 1024, este bucle suele estar limitado por el ancho de banda de memoria, no por las cuentas.</p>`],
 ["La barrera implícita",`<p>Un <code>parallel for</code> termina con una <b>barrera implícita</b>: ningún hilo continúa hasta que <b>todos</b> han terminado. Los que acabaron antes esperan ociosos (rayado en la línea de tiempo).</p><p>Por eso <code>u.swap(aux_u)</code> es seguro: cuando se ejecuta, todas las iteraciones han terminado de escribir <code>aux_u</code>. Sin la barrera, un hilo podría leer valores nuevos mientras otros aún los escriben (una <b>condición de carrera</b>).</p>`],
 ["Intercambiar y repetir",`<p><code>u.swap(aux_u)</code> intercambia los punteros internos de los dos vectores. No se copia ningún dato, igual que el intercambio de punteros en CUDA. Luego <code>main</code> vuelve a llamar a la función: <b>fork, bucle, barrera, join</b>, 400.000 veces.</p><p>Despertar al equipo y la barrera cuestan unos microsegundos por paso. Con mallas muy pequeñas ese coste puede ser mayor que el trabajo.</p>`,`<b>Bug en este proyecto:</b> <code>aux_u</code> y <code>aux_v</code> se copiaron cuando aún valían cero (paso 2), y el bucle nunca escribe el borde. Tras cada intercambio el borde alterna entre U0 y 0, así que la condición de Dirichlet solo se cumple un paso de cada dos. La solución: copiar u en aux_u después de <code>readMatrix</code>.`],
 ["OpenMP y CUDA lado a lado",`<p>Las dos versiones calculan el mismo stencil. Cambia cuántos hilos hay, dónde viven los datos y quién sincroniza.</p>`]
]};

const GLOSS={
en:[["Core","An independent processor inside the CPU, with its own arithmetic units and L1/L2 caches."],["Hardware thread (SMT)","One of the 2 instruction streams a core can hold at once. They share the core's units."],["Software thread","A thread created by OpenMP. The OS places it on a hardware thread."],["Parallel region","Code between fork and join where a team of threads runs."],["Fork / join","The master wakes the team, and later waits for it to finish."],["Master thread","Thread 0. Runs the serial code and joins the team."],["Shared / private","Shared variables have one copy for all threads; private ones have one per thread."],["collapse(n)","Merges n nested loops into one iteration space."],["schedule","How iterations are split: static (fixed chunks) or dynamic (taken on demand)."],["Barrier","A point where every thread waits for all the others."],["Race condition","Two threads touching the same data without order, giving random results."],["Cache line","64 bytes: the unit that moves between RAM and caches."],["Prefetcher","Hardware that predicts the next cache lines and loads them early."],["SIMD","One instruction applied to several values at once (4 doubles with AVX2)."],["Memory bound","Limited by how fast data arrives, not by arithmetic."],["Amdahl's law","The serial part of a program caps its total speedup."]],

function loadLang(){try{const l=localStorage.getItem("om-lang");if(l==="en"||l==="es")return l;}catch(e){}return (navigator.language||"en").toLowerCase().startsWith("es")?"es":"en";}
const S={step:0,p:1,playing:false,hold:0,speed:1,lang:loadLang(),T:8,sched:"static",sel:{i:6,j:9},seed:11};
let U0,V0,U1,sim=null,P=null,C={};

function rng(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;}}
function stepCPU(u,v,un,vn){for(let i=1;i<NN-1;i++)for(let j=1;j<NN-1;j++){const c=i*NN+j,uc=u[c],vc=v[c];const lu=(u[c+NN]-2*uc+u[c-NN])*PRM.idx2+(u[c+1]-2*uc+u[c-1])*PRM.idy2;const lv=(v[c+NN]-2*vc+v[c-NN])*PRM.idx2+(v[c+1]-2*vc+v[c-1])*PRM.idy2;const uuv=uc*uc*vc;un[c]=uc+PRM.dt*(PRM.Du*lu+PRM.A-(PRM.B+1)*uc+uuv);vn[c]=vc+PRM.dt*(PRM.Dv*lv+PRM.B*uc-uuv);}}
function initField(){const r=rng(S.seed);U0=new Float64Array(CELLS);V0=new Float64Array(CELLS);for(let c=0;c<CELLS;c++){U0[c]=2*r();V0[c]=2*r();}U1=U0.slice();const V1=V0.slice();stepCPU(U0,V0,U1,V1);sim=null;}
function resetSim(){const V1=V0.slice();const u1=U0.slice();stepCPU(U0,V0,u1,V1);sim={u:u1,v:V1,un:u1.slice(),vn:V1.slice(),n:1};}
function runSimTo(n){while(sim.n<n){stepCPU(sim.u,sim.v,sim.un,sim.vn);let t=sim.u;sim.u=sim.un;sim.un=t;t=sim.v;sim.v=sim.vn;sim.vn=t;sim.n++;}}
const isBnd=c=>{const i=(c/NN)|0,j=c%NN;return i===0||j===0||i===NN-1||j===NN-1;};
const kOf=(i,j)=>(i-1)*IN+(j-1);
const cOfK=k=>(1+((k/IN)|0))*NN+1+(k%IN);

/* ---------- schedule model ---------- */
function coreOf(t){return t%CORES;}
function slow(t){return (S.T>CORES && t+CORES<S.T) || (S.T>CORES && t>=CORES) ? SMT : 1;}
function plan(nT,kind){
  const r=rng(S.seed*31+nT*7+(kind==="static"?1:2));
  const rowCost=[];for(let k=0;k<IN;k++)rowCost.push(0.85+0.3*r());   // some rows are slower (cache misses, OS noise)
  const cost=(t,k)=>rowCost[(k/IN)|0]*((nT>CORES)?SMT:1);
  const owner=new Int8Array(ITERS),start=new Float64Array(ITERS),end=new Float64Array(ITERS),chunk=new Int16Array(ITERS);
  const segs=[];for(let t=0;t<nT;t++)segs.push([]);
  const tEnd=new Float64Array(nT).fill(FORK);
  if(kind==="static"){
    const per=Math.ceil(ITERS/nT);
    for(let t=0;t<nT;t++){const k0=t*per,k1=Math.min(ITERS,k0+per);let x=FORK;for(let k=k0;k<k1;k++){owner[k]=t;chunk[k]=t;start[k]=x;x+=cost(t,k);end[k]=x;}segs[t].push({a:FORK,b:x,k0,k1});tEnd[t]=x;}
  } else {
    let next=0,ci=0;
    while(next<ITERS){let t=0;for(let q=1;q<nT;q++)if(tEnd[q]<tEnd[t])t=q;const k0=next,k1=Math.min(ITERS,next+DYN_CHUNK);next=k1;let x=tEnd[t]+DYN_COST;const a=x;for(let k=k0;k<k1;k++){owner[k]=t;chunk[k]=ci;start[k]=x;x+=cost(t,k);end[k]=x;}segs[t].push({a,b:x,k0,k1});tEnd[t]=x;ci++;}
  }
  const bar=Math.max(...tEnd), total=bar+JOIN;
  let idle=0;for(let t=0;t<nT;t++)idle+=bar-tEnd[t];
  return {nT,kind,owner,start,end,chunk,segs,tEnd,bar,total,idle:idle/(nT*(bar-FORK)),per:Math.ceil(ITERS/nT)};
}
function buildPlan(){P=plan(S.T,S.sched);P.t1=plan(1,"static").total;}

/* ---------- helpers ---------- */
const tr=(k,v)=>{let s=(T[S.lang][k]??T.en[k]??k);if(v)for(const x in v)s=s.split("{"+x+"}").join(v[x]);return s;};
const nf=n=>n.toLocaleString(S.lang==="es"?"es-ES":"en-US");
const fmt=(x,d)=>(Math.abs(x)<1e-12?0:x).toFixed(d);

/* ---------- code ---------- */
function codeLines(){
  const sch=S.sched==="dynamic"?" schedule(dynamic, 16)":"";
  return [
"Brusselator::Brusselator(int n, int m) : n(n), m(m) {",
"  u = vector<vector<double>>(n, vector<double>(m, 0.0));   // v too",
"  aux_u = u;   aux_v = v;        // copied while still zero",
"}",
"",
"void Brusselator::timeStepForwardEuler(double dt) {",
`  #pragma omp parallel for collapse(2) num_threads(${S.T})${sch}`,
"  for (int i = 1; i < n - 1; ++i) {",
"    for (int j = 1; j < m - 1; ++j) {",
"      double lap_u, lap_v;                 // private to each thread",
"      computeLaplacians(i, j, lap_u, lap_v);",
"      aux_u[i][j] = u[i][j] + Du*lap_u*dt + dt*(A - (B+1)*u[i][j] + u[i][j]*u[i][j]*v[i][j]);",

function threadState(t,tau){

  if(tau>=P.bar) return {st:"idle",txt:tr("st_done")};

  let cur=-1;for(const g of P.segs[t]){if(tau>=g.a&&tau<g.b){for(let k=g.k0;k<g.k1;k++){if(P.end[k]>tau){cur=k;break;}}break;}}

}

  let h=`<div><p class="mstep">1 · ${L("The model","El modelo")}</p>
   <div class="m">${fr("∂"+U,"∂<i>t</i>")} = <span class="dif"><i>D</i>${sb("<i>U</i>")} ∇²${U}</span> + <span class="rea"><i>A</i> + ${U}²${V} − (<i>B</i> + 1)${U}</span></div>
   <div class="m">${fr("∂"+V,"∂<i>t</i>")} = <span class="dif"><i>D</i>${sb("<i>V</i>")} ∇²${V}</span> + <span class="rea"><i>B</i>${U} − ${U}²${V}</span></div>
   <p class="mnote">${L(`<span class="dif">Diffusion</span>: each species spreads toward neighbouring nodes. <span class="rea">Reaction</span>: the species turn into each other at the same node. A = ${PRM.A}, B = ${PRM.B}.`,`<span class="dif">Difusión</span>: cada especie se reparte hacia los nodos vecinos. <span class="rea">Reacción</span>: las especies se transforman una en otra en el mismo nodo. A = ${PRM.A}, B = ${PRM.B}.`)}</p></div>`;
  h+=`<div><p class="mstep">2 · ${L("Forward Euler in time","Forward Euler en el tiempo")}</p>
   <div class="m">${fr("∂"+U,"∂<i>t</i>")} ≈ ${fr(U+n1+" − "+U+n, dt)} &nbsp;⇒&nbsp; ${U}${n1} = ${U}${n} + ${dt} · <i>f</i>(${U}${n}, ${V}${n})</div>
   <p class="mnote">${L(`Replace the derivative by the change over one small step Δt = ${PRM.dt}, then solve for the new value. <i>f</i> is the whole right side of the model. It only uses values from step <i>n</i> (the array <code>u</code>) and writes step <i>n</i>+1 (the array <code>aux_u</code>), so the method is <b>explicit</b>: the iterations do not depend on each other and any thread can do any of them.`,`Se cambia la derivada por el cambio en un paso pequeño Δt = ${PRM.dt} y se despeja el valor nuevo. <i>f</i> es todo el lado derecho del modelo. Solo usa valores del paso <i>n</i> (el arreglo <code>u</code>) y escribe el paso <i>n</i>+1 (el arreglo <code>aux_u</code>), así que el método es <b>explícito</b>: las iteraciones no dependen unas de otras y cualquier hilo puede hacer cualquiera.`)}</p></div>`;
  h+=`<div><p class="mstep">3 · ${L("Laplacian in space: 5-point stencil","Laplaciano en el espacio: stencil de 5 puntos")}</p>
   <div class="m">∇²${U}${sb("<i>i,j</i>")} ≈ ${fr(U+sb("<i>i</i>+1,<i>j</i>")+" − 2"+U+sb("<i>i,j</i>")+" + "+U+sb("<i>i</i>−1,<i>j</i>"),"Δ<i>x</i>²")} + ${fr(U+sb("<i>i,j</i>+1")+" − 2"+U+sb("<i>i,j</i>")+" + "+U+sb("<i>i,j</i>−1"),"Δ<i>y</i>²")}</div>
   <p class="mnote">${L("A second derivative is approximated by (neighbour − 2 × centre + other neighbour) / spacing². It compares the node with its 4 neighbours: it is positive when the node is lower than its surroundings, so diffusion raises it.","Una segunda derivada se aproxima con (vecino − 2 × centro + otro vecino) / espaciado². Compara el nodo con sus 4 vecinos: es positivo cuando el nodo está más bajo que su entorno, así que la difusión lo sube.")}</p></div>`;
  h+=`<div><p class="mstep">4 · ${L("With numbers","Con números")} · ${L("node","nodo")} (${i}, ${j})</p>`;
  if(isBnd(c)){
    h+=`<p class="mnote">${L("This node is on the boundary. The loop never updates it, so it keeps its value U0 (Dirichlet condition). Click an interior cell of the grid.","Este nodo está en la frontera. El bucle nunca lo actualiza, así que conserva su valor U0 (condición de Dirichlet). Haz clic en una celda interior de la malla.")}</p></div>`;
  } else {
    const u=F.u,v=F.v,uc=u[c],vc=v[c],up=u[c-NN],dn=u[c+NN],lf=u[c-1],rt=u[c+1];
    const lu=(dn-2*uc+up)*PRM.idx2+(rt-2*uc+lf)*PRM.idy2;
    const lv=(v[c+NN]-2*vc+v[c-NN])*PRM.idx2+(v[c+1]-2*vc+v[c-1])*PRM.idy2;
    const ru=PRM.A+uc*uc*vc-(PRM.B+1)*uc, rv=PRM.B*uc-uc*uc*vc, du=PRM.Du*lu, dv=PRM.Dv*lv;
    const un=uc+PRM.dt*(du+ru), vn=vc+PRM.dt*(dv+rv), f3=x=>x.toFixed(3);
    h+=`<div class="cross"><span class="c0"></span><span>${f3(up)}</span><span class="c0"></span><span>${f3(lf)}</span><span class="cc">${f3(uc)}</span><span>${f3(rt)}</span><span class="c0"></span><span>${f3(dn)}</span><span class="c0"></span></div>
<div class="num">∇²U ≈ (${f3(dn)} − 2·${f3(uc)} + ${f3(up)})·${PRM.idx2}
    + (${f3(rt)} − 2·${f3(uc)} + ${f3(lf)})·${PRM.idy2} = ${fm(lu)}
<span class="dif">D_U·∇²U</span>        = ${PRM.Du} · ${fm(lu)} = <span class="dif">${fm(du)}</span>
<span class="rea">A + U²V − (B+1)U</span> = 1 + ${f3(uc)}²·${f3(vc)} − 4·${f3(uc)} = <span class="rea">${fm(ru)}</span>
U<sup>n+1</sup> = ${fm(uc)} + ${PRM.dt}·(<span class="dif">${fm(du)}</span> + <span class="rea">${fm(ru)}</span>) = <b>${un.toFixed(6)}</b>
V<sup>n+1</sup> = ${fm(vc)} + ${PRM.dt}·(<span class="dif">${fm(dv)}</span> + <span class="rea">${fm(rv)}</span>) = <b>${vn.toFixed(6)}</b></div>
<p class="mnote">${CODE_REF[S.lang]} ${L("On this toy grid Δx = 1/32, so 1/Δx² = 1024.","En esta malla de juguete Δx = 1/32, así que 1/Δx² = 1024.")}</p></div>`;
  }
  h+=`<p class="mnote mfull">${L(`<b>Stability.</b> An explicit method only works if Δt is small enough. For 2-D diffusion the rule is D·Δt/Δx² ≤ 1/4. In the real run, with Δx = 1/1024: D<sub>U</sub>·Δt/Δx² = 5·10⁻⁵ · 0.0025 · 1024² ≈ 0.131 ≤ 0.25 ✓. With a Δt about twice as large, the numbers would start to oscillate and blow up.`,`<b>Estabilidad.</b> Un método explícito solo funciona si Δt es suficientemente pequeño. Para difusión en 2-D la regla es D·Δt/Δx² ≤ 1/4. En la ejecución real, con Δx = 1/1024: D<sub>U</sub>·Δt/Δx² = 5·10⁻⁵ · 0,0025 · 1024² ≈ 0,131 ≤ 0,25 ✓. Con un Δt del doble, los números empezarían a oscilar y explotarían.`)}</p>`;
  $("mathBody").innerHTML=h;
}
/* ---------------- collapse(2) mini simulation ---------------- */
const MI={nI:4,nJ:5}, MS={collapse:true,tick:0,acc:0,paused:false};
function miniPlan(){
  const T=S.T,nI=MI.nI,nJ=MI.nJ,L=[];for(let t=0;t<T;t++)L.push([]);
  if(MS.collapse){const tot=nI*nJ,q=Math.floor(tot/T),r=tot%T;let k=0;for(let t=0;t<T;t++){const c=q+(t<r?1:0);for(let x=0;x<c;x++,k++)L[t].push({k,i:1+Math.floor(k/nJ),j:1+k%nJ});}}
  else{const q=Math.floor(nI/T),r=nI%T;let row=1;for(let t=0;t<T;t++){const c=q+(t<r?1:0);for(let x=0;x<c;x++,row++)for(let j=1;j<=nJ;j++)L[t].push({k:-1,i:row,j});}}
  return L;
}
function miniUpdate(dt){
  if(MS.paused)return; MS.acc+=dt*S.speed; if(MS.acc<800)return; MS.acc=0;
  const len=Math.max(1,...miniPlan().map(x=>x.length)); MS.tick=(MS.tick+1)%(len+3); drawMini();
}
function drawMini(){
  const es=S.lang==="es",L2=(e,s)=>es?s:e,L=miniPlan(),T=S.T,nI=MI.nI,nJ=MI.nJ,tot=nI*nJ;
  const len=Math.max(1,...L.map(x=>x.length)),running=MS.tick<len,s=Math.min(MS.tick,len),mono=C.mono||"monospace";
  const own={},done=new Set(),cur=new Set();
  L.forEach((lst,t)=>lst.forEach((it,x)=>{const key=it.i*10+it.j;own[key]=t;if(x<s)done.add(key);if(running&&x===s)cur.add(key);}));
  const g=$("miniGrid"),gr=g.getBoundingClientRect();
  if(gr.width){const d=size(g,gr.width,gr.height),x=g.getContext("2d");x.setTransform(d,0,0,d,0,0);x.clearRect(0,0,gr.width,gr.height);
    const cs=28,ox=26,oy=18;x.font=`10px ${mono}`;x.textAlign="center";x.textBaseline="middle";x.fillStyle=C.muted;
    for(let j=1;j<=nJ;j++)x.fillText("j="+j,ox+(j-.5)*cs,oy/2);
    for(let i=1;i<=nI;i++)x.fillText("i="+i,ox/2,oy+(i-.5)*cs);
    for(let i=1;i<=nI;i++)for(let j=1;j<=nJ;j++){const key=i*10+j,t=own[key],px=ox+(j-1)*cs,py=oy+(i-1)*cs,on=cur.has(key);
      if(t!==undefined){x.globalAlpha=on?1:(done.has(key)?.55:.2);x.fillStyle=C.t[t];x.fillRect(px+1,py+1,cs-2,cs-2);x.globalAlpha=1;}
      x.strokeStyle=C.line;x.lineWidth=1;x.strokeRect(px+.5,py+.5,cs-1,cs-1);
      if(on){x.strokeStyle=C.ink;x.lineWidth=2;x.strokeRect(px+1.5,py+1.5,cs-3,cs-3);x.lineWidth=1;}
      x.fillStyle=on?C.bg:C.ink;x.fillText(MS.collapse?String((i-1)*nJ+(j-1)):`${i},${j}`,px+cs/2,py+cs/2+1);}
  }
  const st=$("miniStrip"),sr=st.getBoundingClientRect();
  if(sr.width){const d=size(st,sr.width,sr.height),x=st.getContext("2d");x.setTransform(d,0,0,d,0,0);x.clearRect(0,0,sr.width,sr.height);
    x.font=`10px ${mono}`;x.textAlign="center";x.textBaseline="middle";
    const w=Math.min(30,(sr.width-2)/tot),bh=22;
    if(MS.collapse){
      for(let k=0;k<tot;k++){const i=1+Math.floor(k/nJ),j=1+k%nJ,key=i*10+j,t=own[key],px=1+k*w,on=cur.has(key);
        x.globalAlpha=on?1:(done.has(key)?.55:.25);x.fillStyle=C.t[t];x.fillRect(px+1,2,w-2,bh);x.globalAlpha=1;
        x.fillStyle=on?C.bg:C.ink;x.fillText(String(k),px+w/2,2+bh/2+1);}
    } else {
      for(let i=1;i<=nI;i++){const t=own[i*10+1],px=1+(i-1)*nJ*w,ww=nJ*w;
        const rowCur=[...cur].some(k=>Math.floor(k/10)===i),rowDone=[1,2,3,4,5].slice(0,nJ).every(j=>done.has(i*10+j));
        x.globalAlpha=rowCur?.95:(rowDone?.55:.25);x.fillStyle=C.t[t];x.fillRect(px+1,2,ww-2,bh);x.globalAlpha=1;
        x.fillStyle=rowCur?C.bg:C.ink;x.fillText("i="+i,px+ww/2,2+bh/2+1);}
    }
    L.forEach((lst,t)=>{if(!lst.length)return;let a,b;if(MS.collapse){a=lst[0].k;b=lst[lst.length-1].k+1;}else{a=(lst[0].i-1)*nJ;b=lst[lst.length-1].i*nJ;}
      const x0=1+a*w+2,x1=1+b*w-2,y=bh+8;x.strokeStyle=C.t[t];x.lineWidth=1.5;x.beginPath();x.moveTo(x0,y-3);x.lineTo(x0,y);x.lineTo(x1,y);x.lineTo(x1,y-3);x.stroke();
      x.fillStyle=C.t[t];x.fillText("T"+t,(x0+x1)/2,y+10);});
  }
  $("miniTitle").textContent=L2("How collapse(2) turns two loops into one","Cómo collapse(2) convierte dos bucles en uno");
  $("miniToggle").textContent="collapse(2): "+(MS.collapse?"ON":"OFF");
  $("miniPause").textContent=MS.paused?"▶":"⏸";
  $("miniCode").textContent=MS.collapse
    ? `#pragma omp parallel for collapse(2)\nfor (k = 0; k < ${tot}; ++k) {   // ${nI} × ${nJ} = ${tot}\n  i = 1 + k / ${nJ};\n  j = 1 + k % ${nJ};\n  body(i, j);\n}`
    : `#pragma omp parallel for\nfor (i = 1; i <= ${nI}; ++i)      // ${L2("only "+nI+" to share","solo "+nI+" para repartir")}\n  for (j = 1; j <= ${nJ}; ++j)    // ${L2("stays in one thread","queda en un hilo")}\n    body(i, j);`;
  $("miniLog").innerHTML=L.map((lst,t)=>{let txt;
    if(!lst.length) txt=L2("idle, no work","ocioso, sin trabajo");
    else if(running&&s<lst.length){const it=lst[s];txt=MS.collapse?`k=${it.k} → i=1+${it.k}/${nJ}=${it.i}, j=1+${it.k}%${nJ}=${it.j}`:`i=${it.i}, j=${it.j}`;}
    else txt=`✓ ${lst.length} ${L2("iterations","iteraciones")}`;
    return `<div><span style="color:var(--t${t})">T${t}</span> ${txt}</div>`;}).join("");
  const idle=L.filter(l=>!l.length).length;
  const sum=MS.collapse
    ? L2(`<b>${tot}</b> iterations ÷ <b>${T}</b> threads → at most <b>${len}</b> each. Time: <b>${len}</b> ticks.`,`<b>${tot}</b> iteraciones ÷ <b>${T}</b> hilos → como mucho <b>${len}</b> cada uno. Tiempo: <b>${len}</b> ticks.`)
    : L2(`Only <b>${nI}</b> rows ÷ <b>${T}</b> threads${idle?` → <b>${idle}</b> idle`:""}. Time: <b>${len}</b> ticks.`,`Solo <b>${nI}</b> filas ÷ <b>${T}</b> hilos${idle?` → <b>${idle}</b> ociosos`:""}. Tiempo: <b>${len}</b> ticks.`);
  $("miniNote").innerHTML=sum+" "+L2("Turn collapse(2) off and compare. In the real run there are 1022 × 1022 = 1,044,484 iterations; with 1022 rows and 16 threads both ways balance well, so collapse matters most when there are few rows per thread.","Desactiva collapse(2) y compara. En la ejecución real hay 1022 × 1022 = 1.044.484 iteraciones; con 1022 filas y 16 hilos ambas formas se reparten bien, así que collapse importa sobre todo cuando hay pocas filas por hilo.");
}
$("miniToggle").onclick=()=>{MS.collapse=!MS.collapse;MS.tick=0;MS.acc=0;drawMini();};
$("miniPause").onclick=()=>{MS.paused=!MS.paused;drawMini();};
new ResizeObserver(()=>drawMini()).observe($("miniStrip"));
function renderAll(){renderMachine();drawGrid();drawGantt();drawCache();renderInspector();renderMath();drawMini();$("bar").style.width=(S.p*100)+"%";}
function enter(k){S.step=Math.max(0,Math.min(LAST,k));S.p=0;S.hold=0;
  if(S.step<11)sim=null; if(S.step===11)resetSim(); if(S.step===12&&(!sim||sim.n<2)){resetSim();runSimTo(LIVE);}
  renderCode();renderText();renderAll();playLabel();}
let last=performance.now();
function loop(now){const dt=Math.min(100,now-last);last=now;miniUpdate(dt);
  if(S.p<1){S.p=Math.min(1,S.p+dt*S.speed/META[S.step].d);if(S.step===11)runSimTo(1+Math.floor(S.p*LIVE));renderAll();}
  else if(S.playing){S.hold+=dt*S.speed;if(S.hold>900){if(S.step<LAST)enter(S.step+1);else{S.playing=false;playLabel();}}}
  requestAnimationFrame(loop);}
$("prev").onclick=()=>{S.playing=false;enter(S.step-1);};
$("next").onclick=()=>{S.playing=false;enter(S.step+1);};
$("play").onclick=()=>{if(S.playing)S.playing=false;else{if(S.step===LAST&&S.p>=1){S.playing=true;enter(0);return;}S.playing=true;S.hold=0;}playLabel();};
function seg(id,fn){$(id).onclick=e=>{const b=e.target.closest("button");if(!b)return;[...$(id).children].forEach(x=>x.setAttribute("aria-pressed",x===b));fn(b.dataset.v);};}
seg("speeds",v=>S.speed=+v);
seg("threads",v=>{S.T=+v;buildPlan();renderCode();renderText();renderAll();});
seg("sched",v=>{S.sched=v;buildPlan();renderCode();renderText();renderAll();});
$("langBtn").onclick=()=>{S.lang=S.lang==="es"?"en":"es";try{localStorage.setItem("om-lang",S.lang);}catch(e){}renderStatic();renderCode();renderText();renderAll();playLabel();};
$("glossBtn").onclick=()=>{$("gloss").hidden=!$("gloss").hidden;};
cv.addEventListener("click",e=>{const r=cv.getBoundingClientRect(),j=Math.floor((e.clientX-r.left)/r.width*NN),i=Math.floor((e.clientY-r.top)/r.height*NN);if(i>=0&&i<NN&&j>=0&&j<NN){S.sel={i,j};renderText();renderAll();}});
document.addEventListener("keydown",e=>{if(e.target.closest("input,textarea,select"))return;if(e.key==="ArrowRight"){S.playing=false;enter(S.step+1);}else if(e.key==="ArrowLeft"){S.playing=false;enter(S.step-1);}else if(e.key===" "&&!e.target.closest("button")){e.preventDefault();$("play").click();}});
const rail=$("rail");for(let k=0;k<=LAST;k++){const b=document.createElement("button");b.setAttribute("aria-label",`Step ${k+1}`);b.onclick=()=>{S.playing=false;enter(k);};rail.appendChild(b);}
new ResizeObserver(()=>{drawGrid();drawGantt();drawCache();}).observe(cv.parentElement.parentElement);
const retheme=()=>{readColors();renderAll();};
window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change",retheme);
new MutationObserver(retheme).observe(document.documentElement,{attributes:true,attributeFilter:["data-theme"]});
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>renderAll());
readColors();initField();buildPlan();renderStatic();enter(0);S.p=1;renderAll();playLabel();
requestAnimationFrame(t=>{last=t;requestAnimationFrame(loop);});
})();
</script>
